name: Construir APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Generar proyecto Android
        run: |
          npx cap add android
          bash scripts/configurar-android.sh
          npx cap sync android

      - name: Firma fija (para poder actualizar sin desinstalar)
        run: |
          mkdir -p ~/.android
          base64 -d firma/debug.keystore.b64 > ~/.android/debug.keystore

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publicar APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ventas-pro.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk ventas-pro.apk \
            --title "Ventas Pro - última versión" \
            --notes "Compilado automáticamente desde el commit ${GITHUB_SHA::7}."

      - uses: actions/upload-artifact@v4
        with:
          name: ventas-pro-apk
          path: ventas-pro.apk
